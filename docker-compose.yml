services:
  backend-fastapi:
    build:
      context: ./backend-fastapi
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://reforge:reforge@postgres:5432/reforge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    env_file:
      # Keep the Nest env as a migration fallback for existing provider keys.
      - path: ./backend-nest/.env
        required: false
      - path: ./backend-fastapi/.env
        required: false
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-nest:
    profiles: [rollback]
    build:
      context: ./backend-nest
    command: npm run dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://reforge:reforge@postgres:5432/reforge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    env_file:
      - path: ./backend-nest/.env
        required: false
    ports:
      - '3000:3000'
    volumes:
      - ./backend-nest:/app
      - backend_nest_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reforge
      POSTGRES_USER: reforge
      POSTGRES_PASSWORD: reforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reforge -d reforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_nest_node_modules:
  postgres_data:
  redis_data:
