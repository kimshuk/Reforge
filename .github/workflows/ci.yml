name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi:
    name: FastAPI tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-fastapi/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .

  postgres-contract:
    name: PostgreSQL migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reforge
          POSTGRES_PASSWORD: reforge
          POSTGRES_DB: reforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reforge -d reforge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reforge:reforge@localhost:5432/reforge_ci
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-fastapi/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run migration contract on disposable database
        run: python -m pytest -q tests/test_postgres_category_contract.py

  ios:
    name: iOS tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run NoteAppTests
        run: >-
          xcodebuild test
          -project ios/NoteApp.xcodeproj
          -scheme NoteApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          CODE_SIGNING_ALLOWED=NO
