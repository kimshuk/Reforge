name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android API 37
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Update SDK command-line tools for API 37
        run: |
          sdk_root="${ANDROID_HOME:?}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest"
          if [ -d "$sdk_root/cmdline-tools/latest-2" ]; then
            mv "$sdk_root/cmdline-tools/latest" "$sdk_root/cmdline-tools/previous"
            mv "$sdk_root/cmdline-tools/latest-2" "$sdk_root/cmdline-tools/latest"
          fi
          cmdline_version=$("$sdk_root/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null | grep -Eo '^[0-9]+(\.[0-9]+)*' | head -n 1)
          echo "SDK command-line tools: $cmdline_version"
          test "${cmdline_version%%.*}" -ge 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0"
      - name: Unit tests, lint, and Debug APK
        working-directory: android
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --max-workers=2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on one API 37 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          disable-animations: true
          pre-emulator-launch-script: |
            grep '^target=' "$ANDROID_AVD_HOME/test.ini"
            grep -qx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
          script: cd android && ./gradlew connectedDebugAndroidTest --max-workers=1
