name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android API 37
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"
      - name: Unit tests, lint, and Debug APK
        working-directory: android
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --max-workers=2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on one API 37 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --max-workers=1
