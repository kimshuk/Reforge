name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android SDK 37 / emulator API 36
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0"
      - name: Unit tests, lint, and Debug APK
        working-directory: android
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug --max-workers=2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start ADB server
        run: adb start-server
      - name: Instrumented tests on one API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          pre-emulator-launch-script: |
            grep '^target=' "$ANDROID_AVD_HOME/test.ini"
            grep -qx 'target=android-36' "$ANDROID_AVD_HOME/test.ini"
          script: cd android && ./gradlew connectedDebugAndroidTest --max-workers=1
      - name: Print instrumented test failures
        if: failure()
        run: >-
          find android/app/build/outputs/androidTest-results/connected/debug
          -name 'TEST-*.xml' -exec cat {} ';'
